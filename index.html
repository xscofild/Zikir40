<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Zikir40</title><link rel="manifest" href="manifest.webmanifest"><style>:root{--bg:#07101b;--card:#111b2b;--line:#26354b;--text:#f6f8fb;--muted:#9eabc0;--green:#44d17a;--blue:#5aa7ff;--gold:#f6c453}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07101b,#0c1422);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.wrap{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 80px)}.top{position:sticky;top:0;z-index:4;background:rgba(7,16,27,.94);backdrop-filter:blur(14px);padding:10px 0 12px}h1{font-size:23px;margin:0 0 4px}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:18px}.stat{padding:10px;text-align:center}.stat b{display:block;font-size:20px;color:var(--green)}.bar{height:9px;background:#1b2738;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:.25s}.tabs{display:flex;gap:7px;overflow:auto;padding:11px 0 3px}.tab,.ghost{border:1px solid var(--line);background:#111b2b;color:var(--muted);border-radius:99px;padding:9px 13px}.tab.on{color:#fff;border-color:var(--blue);background:#173155}.card{padding:14px;margin:11px 0}.card.done{border-color:#227744;background:#0e2a20}.row{display:flex;gap:10px;align-items:center}.title{font-weight:800;font-size:17px;flex:1}.target{font-size:12px;color:var(--gold)}.counter{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center;margin-top:12px}.counter button{height:52px;border:0;border-radius:14px;color:#fff;background:#24354d;font-size:27px;font-weight:800}.counter .plus{background:#176f42}.count{text-align:center;font-size:24px;font-weight:900}.count small{font-size:13px;color:var(--muted)}details{margin-top:11px;border-top:1px solid var(--line);padding-top:9px}summary{color:var(--blue);font-weight:700}.detail h3{font-size:13px;color:var(--gold);margin:12px 0 4px}.detail p{margin:0;color:#d8dfeb;line-height:1.55}.actions{display:flex;gap:8px;margin-top:10px}.ghost{background:transparent;border-radius:10px;padding:8px 11px}.lock{position:fixed;inset:0;z-index:10;background:#07101b;display:grid;place-items:center;padding:24px}.lockbox{width:min(390px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;text-align:center}.lock input{width:100%;padding:15px;border-radius:13px;border:1px solid var(--line);background:#091321;color:#fff;text-align:center;font-size:24px;letter-spacing:7px;margin:15px 0}.primary{width:100%;border:0;border-radius:13px;padding:14px;background:var(--green);font-weight:900;color:#062012}.hidden{display:none}.todaydone{padding:12px;border-radius:14px;background:#12351f;color:#84efa9;font-weight:800;text-align:center;margin-top:10px}.notice{font-size:12px;color:var(--muted);margin-top:15px}</style></head><body><div id="lock" class="lock"><div class="lockbox"><div style="font-size:50px">🌙</div><h2>40 Günlük Zikir</h2><div class="muted">Erişim kodunu girin</div><input id="pin" inputmode="numeric" maxlength="6" placeholder="••••••"><button class="primary" id="unlock">Aç</button><p id="err" style="color:#ff7b7b"></p></div></div><main id="app" class="wrap hidden"><section class="top"><h1>🌿 40 Günlük Zikir ve Dua</h1><div id="dates" class="muted"></div><div class="stats"><div class="stat"><b id="dayNo">1/40</b><span>gün</span></div><div class="stat"><b id="pct">0%</b><span>bugün</span></div><div class="stat"><b id="streak">0</b><span>seri</span></div></div><div class="bar"><i id="bar"></i></div><div class="tabs" id="tabs"></div></section><div id="doneMsg"></div><div id="list"></div><p class="notice">Veriler yalnızca bu cihazda saklanır. PIN temel koruma içindir.</p><button class="ghost" id="export">Yedek indir</button> <button class="ghost" id="resetDay">Bugünü sıfırla</button></main><script>const ITEMS=[['Ayetü’l-Kürsî',7,'Ayetü’l-Kürsî','Korunma ve bereket niyetiyle okunur.','Sabah'],['Fâtiha Sûresi',7,'Fâtiha Sûresi','Şifa, rahmet ve hidayet duasıdır.','Sabah'],['Seyyidü’l-İstiğfar',7,'Allahümme ente rabbî lâ ilâhe illâ ente, halaktenî ve ene abdüke ve ene alâ ahdike ve va’dike mesteta’tü. Eûzü bike min şerri mâ sana’tü. Ebûü leke bi ni’metike aleyye ve ebûü bi zenbî. Fağfir lî fe innehû lâ yağfirü’z-zünûbe illâ ente.','Allah’ım, Sen benim Rabbimsin. Beni bağışla; günahları Senden başka bağışlayacak yoktur.','Sabah'],['Estağfirullâhe ve etûbü ileyh',100,'Estağfirullâhe ve etûbü ileyh.','Allah’tan bağışlanma diliyor ve O’na tövbe ediyorum.','Sabah'],['Lâ ilâhe illallâh',100,'Lâ ilâhe illallâh.','Allah’tan başka ilah yoktur.','Sabah'],['Salavat',100,'Allahümme salli alâ Muhammedin ve alâ âli Muhammed.','Allah’ım, Muhammed’e ve ailesine rahmet eyle.','Sabah'],['Sübhânallâhi ve bihamdihî',100,'Sübhânallâhi ve bihamdihî, Sübhânallâhi’l-Azîm.','Allah’ı noksan sıfatlardan tenzih ederim. Hamd O’nadır.','Sabah'],['Hasbünallâhu ve ni’mel-vekîl',100,'Hasbünallâhu ve ni’mel-vekîl.','Allah bize yeter. O ne güzel vekildir.','Sabah'],['Hasbiyallâhu lâ ilâhe illâ hüve',7,'Hasbiyallâhu lâ ilâhe illâ hüve, aleyhi tevekkeltü ve hüve Rabbü’l-arşi’l-azîm.','Allah bana yeter. O’na tevekkül ettim.','Sabah'],['Yâ Rezzâk',308,'Yâ Rezzâk.','Rızık veren.','Esma'],['Yâ Bâsıt',72,'Yâ Bâsıt.','Rızkı genişleten.','Esma'],['Yâ Fettâh',489,'Yâ Fettâh.','Kapıları açan.','Esma'],['Yâ Muğnî',1100,'Yâ Muğnî.','İhtiyaçları gideren.','Esma'],['Yâ Ganiyy',1060,'Yâ Ganiyy.','Hiçbir şeye ihtiyacı olmayan.','Esma'],['Yâ Kerîm',270,'Yâ Kerîm.','Lütfu ve ikramı bol olan.','Esma'],['Yâ Vâsi’',137,'Yâ Vâsi’.','Rahmeti geniş olan.','Esma'],['Yâ Rahmân',100,'Yâ Rahmân.','Merhameti sonsuz olan.','Esma'],['Yâ Rahîm',100,'Yâ Rahîm.','Çok merhamet eden.','Esma'],['Yâ Hayyu Yâ Kayyûm',100,'Yâ Hayyu Yâ Kayyûm.','Daima diri ve her şeyi ayakta tutan.','Esma'],['Yâ Vehhâb',196,'Yâ Vehhâb.','Karşılıksız bağışlayan.','Esma'],['Yâ Latîf',129,'Yâ Latîf.','Lütuf sahibi olan.','Esma'],['Rızık Duası',7,'Allâhümme’kfinî bi-halâlike an harâmike ve ağninî bi-fadlike ammen sivâk.','Allah’ım, helalinle beni haramdan koru ve lütfunla Senden başkasına muhtaç etme.','Dua'],['Borç ve Sıkıntı Duası',7,'Allâhümme innî eûzü bike mine’l-hemmi ve’l-hazeni, ve eûzü bike mine’l-aczi ve’l-keseli, ve eûzü bike mine’l-cübni ve’l-buhli, ve eûzü bike min galebeti’d-deyni ve kahri’r-ricâl.','Allah’ım, üzüntüden, acizlikten, tembellikten, borçtan ve baskıdan Sana sığınırım.','Dua'],['Mülk Sûresi',1,'Mülk Sûresi','Yatsıdan sonra okunabilir.','Akşam'],['Vâkıa Sûresi',1,'Vâkıa Sûresi','Akşam okunabilir.','Akşam'],['Akşam Ayetü’l-Kürsî',1,'Ayetü’l-Kürsî','Yatsıdan sonra okunur.','Akşam']].map((x,i)=>({id:i+1,name:x[0],target:x[1],reading:x[2],meaning:x[3],group:x[4]}));const START=new Date('2026-07-21T00:00:00'),DAYS=40,KEY='zikir40-v2',groups=['Tümü','Sabah','Esma','Dua','Akşam'];let filter='Tümü',store=JSON.parse(localStorage.getItem(KEY)||'{}');const $=s=>document.querySelector(s),dateKey=(d=new Date())=>d.toLocaleDateString('en-CA'),save=()=>localStorage.setItem(KEY,JSON.stringify(store)),state=()=>store[dateKey()]??=( {}),currentDay=()=>Math.max(1,Math.min(DAYS,Math.floor((new Date()-START)/86400000)+1));function unlock(){if($('#pin').value==='300826'){sessionStorage.setItem('zikir-ok','1');$('#lock').classList.add('hidden');$('#app').classList.remove('hidden');render()}else $('#err').textContent='Kod yanlış'}$('#unlock').onclick=unlock;$('#pin').onkeydown=e=>e.key==='Enter'&&unlock();if(sessionStorage.getItem('zikir-ok')){$('#pin').value='300826';unlock()}function renderTabs(){$('#tabs').innerHTML=groups.map(g=>`<button class="tab ${g===filter?'on':''}" data-g="${g}">${g}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filter=b.dataset.g;render()})}function render(){let d=currentDay(),st=state();$('#dates').textContent=`21.07.2026–29.08.2026 • Bugün ${d}. gün`;$('#dayNo').textContent=`${d}/40`;renderTabs();let visible=ITEMS.filter(x=>filter==='Tümü'||x.group===filter);$('#list').innerHTML=visible.map(x=>{let c=st[x.id]||0,done=c>=x.target;return `<article class="card ${done?'done':''}"><div class="row"><div class="title">${done?'✅':'◻️'} ${x.name}</div><div class="target">Hedef ${x.target}</div></div><div class="counter"><button data-id="${x.id}" data-d="-1">−</button><div class="count">${c} <small>/ ${x.target}</small></div><button class="plus" data-id="${x.id}" data-d="1">+</button></div><details><summary>Okunuşu ve anlamı</summary><div class="detail"><h3>OKUNUŞU</h3><p>${x.reading}</p><h3>ANLAMI</h3><p>${x.meaning}</p></div></details><div class="actions"><button class="ghost" data-zero="${x.id}">Sıfırla</button><button class="ghost" data-complete="${x.id}">Tamamla</button></div></article>`}).join('');document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{let x=ITEMS.find(i=>i.id==b.dataset.id),v=(state()[x.id]||0)+Number(b.dataset.d);state()[x.id]=Math.max(0,Math.min(x.target,v));save();render()});document.querySelectorAll('[data-zero]').forEach(b=>b.onclick=()=>{state()[b.dataset.zero]=0;save();render()});document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>{let x=ITEMS.find(i=>i.id==b.dataset.complete);state()[x.id]=x.target;save();render()});let done=ITEMS.filter(x=>(st[x.id]||0)>=x.target).length,p=Math.round(done/ITEMS.length*100);$('#pct').textContent=p+'%';$('#bar').style.width=p+'%';$('#doneMsg').innerHTML=p===100?'<div class="todaydone">✅ Bugünün tüm zikri tamamlandı</div>':'';let streak=0,day=new Date();while(true){let s=store[dateKey(day)]||{},ok=ITEMS.every(x=>(s[x.id]||0)>=x.target);if(!ok)break;streak++;day.setDate(day.getDate()-1)}$('#streak').textContent=streak}$('#resetDay').onclick=()=>confirm('Bugünün tüm sayaçları sıfırlansın mı?')&&(store[dateKey()]={},save(),render());$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(store,null,2)],{type:'application/json'}));a.download='zikir40-yedek.json';a.click()};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
