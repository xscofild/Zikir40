<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1220"><title>40 Günlük Zikir</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#08101d;--card:#111b2b;--line:#26354b;--text:#f6f8fb;--muted:#9eabc0;--green:#44d17a;--blue:#5aa7ff;--gold:#f6c453}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07101b,#0c1422);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}
.wrap{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 90px)}
.top{position:sticky;top:0;z-index:4;background:rgba(8,16,29,.94);backdrop-filter:blur(12px);padding:10px 0 12px}
h1{font-size:23px;margin:0 0 4px}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:17px}.stat{padding:10px;text-align:center}.stat b{display:block;font-size:20px;color:var(--green)}
.bar{height:9px;background:#1b2738;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:.25s}
.tabs{display:flex;gap:7px;overflow:auto;padding:11px 0 3px}.tab{white-space:nowrap;border:1px solid var(--line);background:#111b2b;color:var(--muted);border-radius:99px;padding:9px 13px}.tab.on{color:#fff;border-color:var(--blue);background:#173155}
.card{padding:14px;margin:11px 0}.card.done{border-color:#227744;background:#0e2a20}.row{display:flex;gap:10px;align-items:center}.title{font-weight:800;font-size:17px;flex:1}.target{font-size:12px;color:var(--gold)}
.counter{display:grid;grid-template-columns:54px 1fr 54px;gap:8px;align-items:center;margin-top:12px}.counter button{height:48px;border:0;border-radius:13px;color:#fff;background:#24354d;font-size:25px;font-weight:800}.counter button.plus{background:#176f42}.count{text-align:center;font-size:23px;font-weight:900}.count small{font-size:13px;color:var(--muted)}
details{margin-top:11px;border-top:1px solid var(--line);padding-top:9px}summary{color:var(--blue);font-weight:700;cursor:pointer}.detail h3{font-size:13px;color:var(--gold);margin:12px 0 4px}.detail p{margin:0;color:#d8dfeb;line-height:1.5}
.actions{display:flex;gap:8px;margin-top:10px}.ghost{border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 11px;border-radius:10px}
.lock{position:fixed;inset:0;z-index:10;background:#07101b;display:grid;place-items:center;padding:24px}.lockbox{width:min(390px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;text-align:center}.pin-display{width:100%;padding:15px;border-radius:13px;border:1px solid var(--line);background:#091321;color:#fff;text-align:center;font-size:26px;letter-spacing:10px;margin:15px 0;min-height:60px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.key{height:54px;border:1px solid var(--line);border-radius:14px;background:#162338;color:#fff;font-size:22px;font-weight:800}.key:active{transform:scale(.97);background:#21324c}.primary{width:100%;border:0;border-radius:13px;padding:14px;background:var(--green);font-weight:900;color:#062012}
.hidden{display:none}.notice{font-size:12px;color:var(--muted);margin:8px 2px}.todaydone{padding:12px;border-radius:14px;background:#12351f;color:#84efa9;font-weight:800;text-align:center;margin-top:10px}
</style></head>
<body>
<div id="lock" class="lock"><div class="lockbox"><div style="font-size:48px">🌙</div><h2>40 Günlük Zikir</h2><div class="muted">Erişim kodunu girin</div><div id="pinDisplay" class="pin-display">○ ○ ○ ○ ○ ○</div><div class="keypad" id="keypad"><button class="key" data-num="1">1</button><button class="key" data-num="2">2</button><button class="key" data-num="3">3</button><button class="key" data-num="4">4</button><button class="key" data-num="5">5</button><button class="key" data-num="6">6</button><button class="key" data-num="7">7</button><button class="key" data-num="8">8</button><button class="key" data-num="9">9</button><button class="key" data-clear="1">C</button><button class="key" data-num="0">0</button><button class="key" data-back="1">⌫</button></div><button class="primary" id="unlock">Aç</button><p id="err" style="color:#ff7b7b"></p></div></div>
<main id="app" class="wrap hidden">
<section class="top"><h1>🌿 40 Günlük Zikir ve Dua</h1><div id="dates" class="muted"></div>
<div class="stats"><div class="stat"><b id="dayNo">1/40</b><span>gün</span></div><div class="stat"><b id="pct">0%</b><span>bugün</span></div><div class="stat"><b id="streak">0</b><span>seri</span></div></div>
<div class="bar"><i id="bar"></i></div><div class="tabs" id="tabs"></div></section>
<div id="doneMsg"></div><div id="list"></div>
<p class="notice">Veriler yalnızca bu cihazın tarayıcısında saklanır. Kod, cihazdaki meraklı gözlere karşı temel korumadır; banka güvenliği değildir.</p>
<button class="ghost" id="export">Yedek indir</button> <button class="ghost" id="resetDay">Bugünü sıfırla</button>
</main>
<script>
const ITEMS=[{"id":1,"name":"Ayetü’l-Kürsî","target":7,"reading":"Ayetü’l-Kürsî","meaning":"Allah’ın izniyle korunmaya vesile olur.","group":"Sabah"},{"id":2,"name":"Fâtiha Sûresi","target":7,"reading":"Fâtiha Sûresi","meaning":"Kur’an’ın özü, şifa ve rahmet duasıdır.","group":"Sabah"},{"id":3,"name":"Seyyidü’l-İstiğfar","target":7,"reading":"Allahümme ente rabbî lâ ilâhe illâ ente, halaktenî ve ene abdüke ve ene alâ ahdike ve va’dike mesteta’tü. Eûzü bike min şerri mâ sana’tü. Ebûü leke bi ni’metike aleyye ve ebûü bi zenbî. Fağfir lî fe innehû lâ yağfirü’z-zünûbe illâ ente.","meaning":"Allah’ım! Sen benim Rabbimsin. Senden başka ilah yoktur. Beni Sen yarattın ve ben Senin kulunum. Gücüm yettiğince Sana verdiğim söz üzereyim. Yaptığım kötülüklerin şerrinden Sana sığınırım. Bana verdiğin nimetleri ve günahlarımı kabul ediyorum. Beni bağışla. Çünkü günahları Senden başka bağışlayacak kimse yoktur.","group":"Sabah"},{"id":4,"name":"Estağfirullâhe ve etûbü ileyh","target":100,"reading":"Estağfirullâhe ve etûbü ileyh.","meaning":"Allah’tan bağışlanma diliyor ve O’na tövbe ediyorum.","group":"Sabah"},{"id":5,"name":"Estağfirullâhe’l-Azîm","target":100,"reading":"Estağfirullâhe’l-Azîm.","meaning":"Yüce Allah’tan bağışlanma diliyorum.","group":"Sabah"},{"id":6,"name":"Lâ ilâhe illallâh","target":100,"reading":"Lâ ilâhe illallâh.","meaning":"Allah’tan başka ilah yoktur.","group":"Sabah"},{"id":7,"name":"Salavat","target":100,"reading":"Allahümme salli alâ Muhammedin ve alâ âli Muhammed.","meaning":"Allah’ım! Peygamberimiz Muhammed’e ve ailesine rahmet ve bereket ihsan eyle.","group":"Sabah"},{"id":8,"name":"Sübhânallâhi ve bihamdihî","target":100,"reading":"Sübhânallâhi ve bihamdihî, Sübhânallâhi’l-Azîm.","meaning":"Allah’ı noksan sıfatlardan tenzih ederim. Hamd O’nadır.","group":"Sabah"},{"id":9,"name":"Hasbünallâhu ve ni’mel-vekîl","target":100,"reading":"Hasbünallâhu ve ni’mel-vekîl.","meaning":"Allah bize yeter. O ne güzel vekildir.","group":"Sabah"},{"id":10,"name":"Hasbiyallâhu lâ ilâhe illâ hüve","target":7,"reading":"Hasbiyallâhu lâ ilâhe illâ hüve, aleyhi tevekkeltü ve hüve Rabbü’l-arşi’l-azîm.","meaning":"Allah bana yeter. O’ndan başka ilah yoktur. O’na tevekkül ettim. O, büyük Arş’ın Rabbidir.","group":"Sabah"},{"id":11,"name":"Yâ Rezzâk","target":308,"reading":"Yâ Rezzâk.","meaning":"Rızık veren ve nimetleri ulaştıran.","group":"Esma"},{"id":12,"name":"Yâ Bâsıt","target":72,"reading":"Yâ Bâsıt.","meaning":"Rızkı genişleten ve ferahlık veren.","group":"Esma"},{"id":13,"name":"Yâ Fettâh","target":489,"reading":"Yâ Fettâh.","meaning":"Kapıları açan ve işleri kolaylaştıran.","group":"Esma"},{"id":14,"name":"Yâ Muğnî","target":1100,"reading":"Yâ Muğnî.","meaning":"Zengin eden ve ihtiyaçları gideren.","group":"Esma"},{"id":15,"name":"Yâ Ganiyy","target":1060,"reading":"Yâ Ganiyy.","meaning":"Hiçbir şeye ihtiyacı olmayan.","group":"Esma"},{"id":16,"name":"Yâ Kerîm","target":270,"reading":"Yâ Kerîm.","meaning":"Lütfu ve ikramı bol olan.","group":"Esma"},{"id":17,"name":"Yâ Vâsi’","target":137,"reading":"Yâ Vâsi’.","meaning":"Rahmeti ve nimeti geniş olan.","group":"Esma"},{"id":18,"name":"Yâ Rahmân","target":100,"reading":"Yâ Rahmân.","meaning":"Merhameti sonsuz olan.","group":"Esma"},{"id":19,"name":"Yâ Rahîm","target":100,"reading":"Yâ Rahîm.","meaning":"Çok merhamet eden.","group":"Esma"},{"id":20,"name":"Yâ Hayyu Yâ Kayyûm","target":100,"reading":"Yâ Hayyu Yâ Kayyûm.","meaning":"Daima diri olan ve her şeyi ayakta tutan.","group":"Esma"},{"id":21,"name":"Yâ Vehhâb","target":196,"reading":"Yâ Vehhâb.","meaning":"Karşılıksız ve bolca bağışlayan.","group":"Esma"},{"id":22,"name":"Yâ Latîf","target":129,"reading":"Yâ Latîf.","meaning":"Lütuf sahibi olan ve umulmadık yerlerden rızık ulaştıran.","group":"Esma"},{"id":23,"name":"Rızık Duası","target":7,"reading":"Allâhümme’kfinî bi-halâlike an harâmike ve ağninî bi-fadlike ammen sivâk.","meaning":"Allah’ım! Bana helalinden nasip ederek haramından koru. Lütfunla beni Senden başkasına muhtaç etme.","group":"Dua"},{"id":24,"name":"Borç ve Sıkıntı Duası","target":7,"reading":"Allâhümme innî eûzü bike mine’l-hemmi ve’l-hazeni, ve eûzü bike mine’l-aczi ve’l-keseli, ve eûzü bike mine’l-cübni ve’l-buhli, ve eûzü bike min galebeti’d-deyni ve kahri’r-ricâl.","meaning":"Allah’ım! Üzüntüden, kederden, acizlikten, tembellikten, korkaklıktan, cimrilikten, borç altında ezilmekten ve insanların baskısından Sana sığınırım.","group":"Dua"},{"id":25,"name":"Mülk Sûresi","target":1,"reading":"Mülk Sûresi","meaning":"Yatsı namazından sonra okunabilir.","group":"Akşam"},{"id":26,"name":"Vâkıa Sûresi","target":1,"reading":"Vâkıa Sûresi","meaning":"Akşam okunmadıysa yatsı namazından sonra okunabilir.","group":"Akşam"},{"id":27,"name":"Akşam Ayetü’l-Kürsî","target":1,"reading":"Ayetü’l-Kürsî","meaning":"Yatsı namazından sonra okunur.","group":"Akşam"}];
const START=new Date('2026-07-21T00:00:00'); const DAYS=40; const KEY='zikir40-v3';
const groups=['Tümü','Sabah','Esma','Dua','Akşam']; let filter='Tümü';
const $=s=>document.querySelector(s); let store=JSON.parse(localStorage.getItem(KEY)||'{}');
function dateKey(d=new Date()){return d.toLocaleDateString('en-CA')} function save(){localStorage.setItem(KEY,JSON.stringify(store))}
function currentDay(){return Math.max(1,Math.min(DAYS,Math.floor((new Date()-START)/86400000)+1))}
function state(){let k=dateKey(); store[k]??={}; return store[k]}
let pinValue='';function drawPin(){const n=pinValue.length;$('#pinDisplay').textContent=[0,1,2,3,4,5].map(i=>i<n?'●':'○').join(' ')}function unlock(){if(pinValue==='300826'){sessionStorage.setItem('zikir-ok','1');$('#lock').classList.add('hidden');$('#app').classList.remove('hidden');$('#err').textContent='';render()}else{$('#err').textContent='Kod yanlış';pinValue='';drawPin()}}$('#unlock').onclick=unlock;document.querySelectorAll('[data-num]').forEach(b=>b.onclick=()=>{if(pinValue.length<6){pinValue+=b.dataset.num;drawPin();if(pinValue.length===6)unlock()}});document.querySelector('[data-clear]').onclick=()=>{pinValue='';drawPin();$('#err').textContent=''};document.querySelector('[data-back]').onclick=()=>{pinValue=pinValue.slice(0,-1);drawPin();$('#err').textContent=''};if(sessionStorage.getItem('zikir-ok')){pinValue='300826';unlock()}drawPin();
function renderTabs(){$('#tabs').innerHTML=groups.map(g=>`<button class="tab ${g===filter?'on':''}" data-g="${g}">${g}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filter=b.dataset.g;render()})}
function render(){let d=currentDay();$('#dates').textContent=`21.07.2026–29.08.2026 • Bugün ${d}. gün`;$('#dayNo').textContent=`${d}/40`;renderTabs();let st=state(),visible=ITEMS.filter(x=>filter==='Tümü'||x.group===filter);$('#list').innerHTML=visible.map(x=>{let c=st[x.id]||0,done=c>=x.target;return `<article class="card ${done?'done':''}"><div class="row"><div class="title">${done?'✅':'◻️'} ${x.name}</div><div class="target">Hedef ${x.target}</div></div><div class="counter"><button data-id="${x.id}" data-d="-1">−</button><div class="count">${c} <small>/ ${x.target}</small></div><button class="plus" data-id="${x.id}" data-d="1">+</button></div><details><summary>Okunuşu ve anlamı</summary><div class="detail"><h3>OKUNUŞU</h3><p>${x.reading}</p><h3>ANLAMI</h3><p>${x.meaning}</p></div></details><div class="actions"><button class="ghost" data-zero="${x.id}">Sıfırla</button><button class="ghost" data-complete="${x.id}">Tamamla</button></div></article>`}).join('');document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{let x=ITEMS.find(i=>i.id==b.dataset.id),v=(state()[x.id]||0)+Number(b.dataset.d);state()[x.id]=Math.max(0,Math.min(x.target,v));save();render()});document.querySelectorAll('[data-zero]').forEach(b=>b.onclick=()=>{state()[b.dataset.zero]=0;save();render()});document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>{let x=ITEMS.find(i=>i.id==b.dataset.complete);state()[x.id]=x.target;save();render()});let done=ITEMS.filter(x=>(st[x.id]||0)>=x.target).length,p=Math.round(done/ITEMS.length*100);$('#pct').textContent=p+'%';$('#bar').style.width=p+'%';$('#doneMsg').innerHTML=p===100?'<div class="todaydone">✅ Bugünün tüm zikri tamamlandı</div>':'';let streak=0,day=new Date();while(true){let k=dateKey(day),s=store[k]||{},ok=ITEMS.every(x=>(s[x.id]||0)>=x.target);if(!ok)break;streak++;day.setDate(day.getDate()-1)}$('#streak').textContent=streak}
$('#resetDay').onclick=()=>{if(confirm('Bugünün tüm sayaçları sıfırlansın mı?')){store[dateKey()]={};save();render()}};
$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(store,null,2)],{type:'application/json'}));a.download='zikir40-yedek.json';a.click()};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
