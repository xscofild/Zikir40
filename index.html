{id:'seyyid',name:'Seyyidü’l-İstiğfar',target:7,when:'Sabah 1 veya 7 defa',group:'Sabah',reading:'Allahümme ente rabbî lâ ilâhe illâ ente, halaktenî ve ene abdüke ve ene alâ ahdike ve va’dike mesteta’tü. Eûzü bike min şerri mâ sana’tü. Ebûü leke bi ni’metike aleyye ve ebûü bi zenbî. Fağfir lî fe innehû lâ yağfirü’z-zünûbe illâ ente.',meaning:'Allah’ım! Sen benim Rabbimsin. Senden başka ilah yoktur. Beni Sen yarattın ve ben Senin kulunum. Gücüm yettiğince Sana verdiğim söz üzereyim. Yaptığım kötülüklerin şerrinden Sana sığınırım. Bana verdiğin nimetleri ikrar ediyor, günahlarımı itiraf ediyorum. Beni bağışla. Çünkü günahları Senden başka bağışlayacak kimse yoktur.'},

{id:'borc',name:'Borç ve Sıkıntı Duası',target:7,when:'Sabah ve akşam 1–7 defa',group:'Dua',reading:'Allâhümme innî eûzü bike mine’l-hemmi ve’l-hazeni, ve eûzü bike mine’l-aczi ve’l-keseli, ve eûzü bike mine’l-cübni ve’l-buhli, ve eûzü bike min galebeti’d-deyni ve kahri’r-ricâl.',meaning:'Allah’ım! Üzüntüden, kederden, acizlikten, tembellikten, korkaklıktan, cimrilikten, borç altında ezilmekten ve insanların baskısından Sana sığınırım.'},
{id:'mulk',name:'Mülk Sûresi',target:1,when:'Yatsıdan sonra',group:'Akşam',reading:'Mülk Sûresi',meaning:'Yatsı namazından sonra okunur.'},
{id:'vakia',name:'Vâkıa Sûresi',target:1,when:'Yatsıdan sonra; akşam okunmadıysa',group:'Akşam',reading:'Vâkıa Sûresi',meaning:'Yatsıdan sonra okunabilir.'},

{id:'bismillah',name:'Bismillâhirrahmânirrahîm',target:1,when:'Yatsıdan sonra',group:'Akşam',reading:'Bismillâhirrahmânirrahîm.',meaning:'Rahmân ve Rahîm olan Allah’ın adıyla.'},
{id:'mennan',name:'Mennân Duası',target:1,when:'Yatsıdan sonra',group:'Akşam',reading:'Allâhümme innî es’elüke bi-enne leke’l-hamde lâ ilâhe illâ ente’l-Mennânu, Bedîu’s-semâvâti ve’l-ard, yâ Ze’l-Celâli ve’l-İkrâm, yâ Hayyu yâ Kayyûm.',meaning:'Allah’ım! Hamdin yalnız Sana mahsus olduğuna dayanarak Senden istiyorum. Senden başka ilah yoktur. Sen Mennân’sın, göklerin ve yerin eşsiz yaratıcısısın. Ey Celâl ve İkram sahibi, ey Hayy ve Kayyûm!'},
{id:'zalim',name:'Lâ ilâhe illâ ente sübhâneke',target:1,when:'Yatsıdan sonra',group:'Akşam',reading:'Lâ ilâhe illâ ente sübhâneke innî kuntu mine’z-zâlimîn.',meaning:'Senden başka ilah yoktur. Seni her türlü eksiklikten tenzih ederim. Şüphesiz ben nefsine zulmedenlerden oldum.'},
{id:'ehad',name:'Ehad ve Samed Duası',target:1,when:'Yatsıdan sonra',group:'Akşam',reading:'Allâhümme innî es’elüke bi-ennî eşhedü enneke entellâhu lâ ilâhe illâ ente’l-Ehadü’s-Samedü’l-lezî lem yelid ve lem yûled ve lem yekun lehû kufuven ehad.',meaning:'Allah’ım! Senden başka ilah olmadığına, Senin tek ve hiçbir şeye muhtaç olmayan olduğuna, doğurmadığına, doğurulmadığına ve hiçbir şeyin Sana denk olmadığına şehadet ederek Senden diliyorum.'},
{id:'basitu',name:'Yâ Bâsitu, Yâ Vâsiu, Yâ Razzâku',target:1,when:'Yatsıdan sonra',group:'Akşam',reading:'Yâ Bâsitu, yâ Vâsiu, yâ Razzâku, yâ Kerîmu, yâ Rahmânu, yâ Rahîm. Yâ Nûru’s-semâvâti ve’l-ard, yâ İmâde’s-semâvâti ve’l-ard, yâ Cebbâru’s-semâvâti ve’l-ard, yâ Deyyâne’s-semâvâti ve’l-ard.',meaning:'Ey lütfunu yayan, ey rahmeti geniş olan, ey rızık veren, ey kerem sahibi, ey Rahmân, ey Rahîm! Ey göklerin ve yerin nuru, direği, hâkimi!'},
{id:'aman',name:'El-Amân Duası',target:1,when:'Yatsıdan sonra',group:'Akşam',reading:'Yâ Hayyu yâ Kayyûm, bi-rahmetike esteğîsu, el-amâne el-amân, min zevâli’n-ni’meti ve tahavvuli’l-âfiyeti ve fücâeti’n-nikmeti ve cemîi sehatik.',meaning:'Ey Hayy ve Kayyûm olan Allah’ım! Rahmetine sığınıyorum. Nimetin zail olmasından, afiyetin bozulmasından, ansızın gelecek azabından ve her türlü gazabından Sana sığınırım.'},

const FAMILY_DUA=`Allah’ım! Dayımız Batyra hayırlı, helâl ve bereketli rızıklar ihsan eyle. Üzerindeki bütün hayırlı işleri kolaylaştır. Açılmasını dilediğin kapıları ona aç. Onu doğruluktan ve adaletten ayırma. Emeğini bereketlendir, işlerini büyüt, hayırlı ortaklıklar ve başarılar nasip eyle. Eğer bu işler bizim ailemizin dünya ve ahiretimiz için hayırlıysa, onları en güzel şekilde neticelendir. Onun vesilesiyle ailemize helâl rızık, birlik, huzur ve bereket ihsan eyle.

Allah’ım! Bu duaya ve zikre katılan aile fertlerimiz; Gulzada, Serdar, Çınar, Merdan, Gulnara, Gulnur, Maral, Şemsat, Nusret, Aynur, Meryem, Muhammet, Habib, Yusuf, Yasemin, Ziyad, Meryem, Muhammet, Elif, Amine, Ayşe, Sara ve Hamza’yı dünya ve ahiret saadetine eriştir. Kalplerimize iman, ihlas ve takva ver. Aramızdaki sevgi ve muhabbeti artır. Bizleri birbirimize destek olan, Senin rızan için yaşayan bir aile eyle.

Her birimize sağlık, afiyet, helâl ve bereketli rızık, hayırlı ömür ve salih ameller nasip eyle. Evlatlarımızı muhafaza eyle, neslimizi salih kullarından eyle. Bizleri anne ve babalarımıza karşı hayırlı evlatlardan, çocuklarımıza karşı hayırlı anne ve babalardan eyle. Borçlarımızı kolayca ödemeyi nasip eyle. Hastalarımıza şifa, sıkıntıda olanlarımıza ferahlık, vefat edenlerimize rahmet ihsan eyle. Dünyada da ahirette de bize iyilik ver, bizi cehennem azabından koru. Dualarımızı kabul eyle. Peygamberimiz Muhammed’e, âline ve ashabına salât ve selâm eyle. Âmin.`;
let store=JSON.parse(localStorage.getItem(KEY)||'{}');let filter='Tümü';const groups=['Tümü','Sabah','Esma','Akşam','Dua','Takvim'];const $=s=>document.querySelector(s);const dateKey=(d=new Date())=>d.toLocaleDateString('en-CA');const save=()=>localStorage.setItem(KEY,JSON.stringify(store));const currentDay=()=>Math.max(1,Math.min(DAYS,Math.floor((new Date()-START)/86400000)+1));function state(k=dateKey()){store[k]??={counts:{},manual:0,family:false};store[k].counts??={};return store[k]}function dayDate(i){let d=new Date(START);d.setDate(d.getDate()+i);return d}function dayStatus(k){let s=state(k);let done=ITEMS.filter(x=>(s.counts[x.id]||0)>=x.target).length;let auto=done===ITEMS.length?2:done>0?1:0;return Math.max(auto,s.manual||0)}function renderTabs(){$('#tabs').innerHTML=groups.map(g=>`<button class="tab ${g===filter?'on':''}" data-g="${g}">${g}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filter=b.dataset.g;render()})}function renderCalendar(){let today=dateKey();$('#calendar').innerHTML=Array.from({length:DAYS},(_,i)=>{let d=dayDate(i),k=dateKey(d),st=dayStatus(k),future=d>new Date();return `<button class="day ${st===2?'done':st===1?'partial':''} ${k===today?'today':''} ${future?'future':''}" data-day="${k}"><b>${i+1}. gün</b>${d.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'})}<br>${st===2?'✓ Tamam':st===1?'◐ Kısmi':'○ Boş'}</button>`}).join('');document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{let s=state(b.dataset.day);s.manual=((s.manual||0)+1)%3;save();renderCalendar();updateStats()})}function updateStats(){let st=state(),done=ITEMS.filter(x=>(st.counts[x.id]||0)>=x.target).length,p=Math.round(done/ITEMS.length*100);$('#pct').textContent=p+'%';$('#bar').style.width=p+'%';$('#completedDays').textContent=Array.from({length:DAYS},(_,i)=>dayStatus(dateKey(dayDate(i)))===2).filter(Boolean).length;$('#dayNo').textContent=currentDay()+'/40'}function render(){renderTabs();renderCalendar();let d=currentDay();$('#dates').textContent=`21.07.2026–29.08.2026 • Bugün ${d}. gün`;$('#calendarPanel').classList.toggle('hidden',filter!=='Tümü'&&filter!=='Takvim');$('#familyDua').classList.toggle('hidden',filter!=='Tümü'&&filter!=='Dua');let visible=filter==='Takvim'?[]:ITEMS.filter(x=>filter==='Tümü'||x.group===filter),st=state();$('#list').innerHTML=visible.map(x=>{let c=st.counts[x.id]||0,done=c>=x.target;return `<article class="card ${done?'done':''}"><div class="head"><div class="check">${done?'✅':'⬜'}</div><div class="title">${x.name}<div class="when">${x.when}</div></div><div class="target">Hedef ${x.target}</div></div><div class="counter"><button data-id="${x.id}" data-d="-1">−</button><div class="count">${c} <small>/ ${x.target}</small></div><button class="plus" data-id="${x.id}" data-d="1">+</button></div><details><summary>Okunuşu, anlamı ve tam metin</summary><div class="detail">${x.arabic?`<h3>ARAPÇA</h3><p class="arabic">${x.arabic}</p>`:''}<h3>OKUNUŞU</h3><p>${x.reading}</p><h3>ANLAMI</h3><p>${x.meaning}</p></div></details><div class="actions"><button class="ghost" data-zero="${x.id}">Sıfırla</button><button class="ghost" data-complete="${x.id}">Tamamla</button></div></article>`}).join('');document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{let x=ITEMS.find(i=>i.id===b.dataset.id),v=(state().counts[x.id]||0)+Number(b.dataset.d);state().counts[x.id]=Math.max(0,Math.min(x.target,v));save();render()});document.querySelectorAll('[data-zero]').forEach(b=>b.onclick=()=>{state().counts[b.dataset.zero]=0;save();render()});document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>{let x=ITEMS.find(i=>i.id===b.dataset.complete);state().counts[x.id]=x.target;save();render()});$('#familyText').textContent=FAMILY_DUA;$('#familyDone').textContent=state().family?'✅ Bugün okundu':'Bugün okudum';updateStats()}$('#familyDone').onclick=()=>{state().family=!state().family;save();render()};$('#resetDay').onclick=()=>{if(confirm('Bugünün tüm sayaçları ve aile duası sıfırlansın mı?')){store[dateKey()]={counts:{},manual:0,family:false};save();render()}};$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(store,null,2)],{type:'application/json'}));a.download='zikir40-yedek.json';a.click()};render();
