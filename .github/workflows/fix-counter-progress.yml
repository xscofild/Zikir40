name: Fix counter progress and open dua

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-counter-progress.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch application
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Progress must count every completed repetition proportionally.
          old = "let st=state(),done=ITEMS.filter(x=>(st.counts[x.id]||0)>=x.target).length,p=Math.round(done/ITEMS.length*100);"
          new = "let st=state(),done=ITEMS.filter(x=>(st.counts[x.id]||0)>=x.target).length,p=Math.round(ITEMS.reduce((sum,x)=>sum+Math.min((st.counts[x.id]||0)/x.target,1),0)/ITEMS.length*100);"
          if old not in s:
              raise SystemExit('Progress formula not found')
          s = s.replace(old, new, 1)

          # Keep an opened prayer expanded after +, -, reset or complete.
          old = "let visible=filter==='Takvim'?[]:ITEMS.filter(x=>filter==='Tümü'||x.group===filter),st=state();$('#list').innerHTML=visible.map(x=>{"
          new = "let openItems=new Set([...document.querySelectorAll('#list .card details[open]')].map(d=>d.closest('.card')?.dataset.item).filter(Boolean));let visible=filter==='Takvim'?[]:ITEMS.filter(x=>filter==='Tümü'||x.group===filter),st=state();$('#list').innerHTML=visible.map(x=>{"
          if old not in s:
              raise SystemExit('Render start not found')
          s = s.replace(old, new, 1)

          old = "return `<article class=\"card ${done?'done':''}\">"
          new = "return `<article data-item=\"${x.id}\" class=\"card ${done?'done':''}\">"
          if old not in s:
              raise SystemExit('Card markup not found')
          s = s.replace(old, new, 1)

          old = "</div><details><summary>Okunuşu, anlamı ve tam metin</summary>"
          new = "</div><details ${openItems.has(x.id)?'open':''}><summary>Okunuşu, anlamı ve tam metin</summary>"
          if old not in s:
              raise SystemExit('Details markup not found')
          s = s.replace(old, new, 1)

          # Do not show only the surah name as if it were the reading text.
          s = s.replace("reading:'Mülk Sûresi',meaning:'Yatsı namazından sonra okunur.'", "reading:'Mülk Sûresi’nin tamamı Mushaf veya güvenilir Kur’an metninden okunur.',meaning:'Bu bölüm kısa bir dua değil, 30 ayetten oluşan tam bir sûredir. Uygulamada tamamını okuduğunda + veya Tamamla düğmesine bas.'", 1)
          s = s.replace("reading:'Vâkıa Sûresi',meaning:'Yatsıdan sonra okunabilir.'", "reading:'Vâkıa Sûresi’nin tamamı Mushaf veya güvenilir Kur’an metninden okunur.',meaning:'Bu bölüm kısa bir dua değil, tam bir sûredir. Uygulamada tamamını okuduğunda + veya Tamamla düğmesine bas.'", 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix proportional progress and keep prayers open [skip ci]"
          git push
