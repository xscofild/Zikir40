name: Apply Zikir40 audited UI patch

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/polish-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate patch script
        run: python3 -m py_compile .github/scripts/fix_tabs_audit.py
      - name: Apply tab, prayer toggle and audit fixes
        run: python3 .github/scripts/fix_tabs_audit.py
      - name: Audit generated app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not scripts:
              raise SystemExit('main script not found')
          Path('/tmp/zikir40-app.js').write_text(scripts[-1],encoding='utf-8')
          ids=[x for x in re.findall(r'\bid="([^"]+)"',s) if '$' not in x and '{' not in x]
          dup=sorted({x for x in ids if ids.count(x)>1})
          if dup:
              raise SystemExit('duplicate static HTML ids: '+', '.join(dup))
          required=['Bugün','Sabah','Esma','Akşam','Dua','Takvim','renderPrayers','renderCalendar','applyView']
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('missing app markers: '+', '.join(missing))
          print('HTML structural audit passed')
          PY
          node --check /tmp/zikir40-app.js
          node --check sw.js
      - name: Commit audited app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Fix tabs, prayer toggles and daily dashboard [skip ci]"
          git push
