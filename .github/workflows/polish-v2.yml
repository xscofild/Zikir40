name: Apply Zikir40 app patch

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/polish-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply continuous calendar and birthday patch
        run: python3 .github/scripts/continuous_calendar_birthday.py
      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Add endless calendar and family birthday reminders [skip ci]"
          git push
