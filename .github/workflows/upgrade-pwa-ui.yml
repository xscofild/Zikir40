name: Upgrade PWA UI and offline support

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/upgrade-pwa-ui.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('<title>Zikir40</title>', '<title>Zikir40</title>\n<link rel="manifest" href="./manifest.webmanifest">\n<link rel="apple-touch-icon" href="./icon.svg">')

          s=s.replace('.hero{padding:8px 2px 14px}', '.app-header{position:sticky;top:0;z-index:20;margin:0 -14px;padding:calc(env(safe-area-inset-top) + 8px) 14px 9px;background:linear-gradient(180deg,rgba(7,16,27,.99),rgba(7,16,27,.94));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(113,173,255,.16);box-shadow:0 12px 30px rgba(0,0,0,.22)}.hero{padding:2px 2px 10px}')
          s=s.replace('.nav{position:sticky;top:0;z-index:5;background:rgba(7,16,27,.95);backdrop-filter:blur(14px);padding:9px 0}', '.nav{padding:7px 0 0}')
          s=s.replace('.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green))}', '.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .25s ease}')
          s=s.replace('.card{padding:15px;margin:12px 0}', '.card{padding:15px;margin:12px 0;box-shadow:0 12px 28px rgba(0,0,0,.16);transition:border-color .2s,transform .15s}.card:active{transform:scale(.997)}')
          s=s.replace('.hidden{display:none}', '.item-progress{height:6px;background:#1d2a3c;border-radius:99px;overflow:hidden;margin-top:11px}.item-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .2s}.statusline{display:flex;justify-content:space-between;gap:10px;margin-top:7px;color:var(--muted);font-size:12px}.net{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:5px}.net:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green)}.net.offline:before{background:var(--gold)}.install-note{display:none;margin:12px 0;padding:12px 14px;border:1px solid var(--line);border-radius:15px;background:#101d30;color:#dce7f7;font-size:13px;line-height:1.5}.install-note.show{display:block}.hidden{display:none}@media(max-width:430px){.hero h1{font-size:22px}.stats{margin:10px 0}.stat{padding:8px}.stat b{font-size:19px}.tabs{gap:6px}.tab{padding:9px 12px}.app-header{padding-bottom:8px}}')

          s=s.replace('<section class="hero">', '<header class="app-header"><section class="hero">',1)
          s=s.replace('</section>\n<section class="nav"><div class="tabs" id="tabs"></div></section>', '<div id="network" class="net">Çevrimiçi • çevrimdışı kullanım hazır</div></section>\n<section class="nav"><div class="tabs" id="tabs"></div></section></header>',1)
          s=s.replace('<section id="calendarPanel"', '<div id="installNote" class="install-note">📲 iPhone’a uygulama gibi kurmak için Safari’de Paylaş düğmesine basıp <b>Ana Ekrana Ekle</b> seçeneğini seç. Bir kez açıldıktan sonra internet olmadan da çalışır.</div>\n<section id="calendarPanel"',1)

          marker='<div class="counter"><button data-id="${x.id}" data-d="-1">−</button><div class="count">${c} <small>/ ${x.target}</small></div><button class="plus" data-id="${x.id}" data-d="1">+</button></div>'
          repl=marker+'<div class="item-progress"><i style="width:${Math.round(Math.min(c/x.target,1)*100)}%"></i></div><div class="statusline"><span>${Math.round(Math.min(c/x.target,1)*100)}% tamamlandı</span><span>${Math.max(x.target-c,0)} kaldı</span></div>'
          if marker not in s: raise SystemExit('counter markup not found')
          s=s.replace(marker,repl,1)

          s=s.replace("$('#familyText').textContent=FAMILY_DUA;", "$('#familyText').textContent=FAMILY_DUA;document.title=`${$('#pct').textContent} • Zikir40`;",1)

          s=s.replace("render();\n</script>", "render();\nconst networkEl=$('#network'),installNote=$('#installNote');function setNetwork(){const off=!navigator.onLine;networkEl.classList.toggle('offline',off);networkEl.textContent=off?'Çevrimdışı • tüm veriler cihazda':'Çevrimiçi • çevrimdışı kullanım hazır'}addEventListener('online',setNetwork);addEventListener('offline',setNetwork);setNetwork();if(!navigator.standalone)installNote.classList.add('show');if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js?v=8').then(r=>r.update()).catch(()=>{})}\n</script>",1)

          p.write_text(s,encoding='utf-8')

          Path('manifest.webmanifest').write_text('''{
            "name":"40 Günlük Aile Zikir ve Dua",
            "short_name":"Zikir40",
            "start_url":"./",
            "scope":"./",
            "display":"standalone",
            "background_color":"#07101b",
            "theme_color":"#07101b",
            "description":"40 günlük zikir, dua, sayaç ve takip uygulaması.",
            "icons":[{"src":"./icon.svg","sizes":"any","type":"image/svg+xml","purpose":"any maskable"}]
          }''',encoding='utf-8')

          Path('sw.js').write_text('''const CACHE='zikir40-v8';
          const ASSETS=['./','./index.html','./manifest.webmanifest','./icon.svg'];
          self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)).then(()=>self.skipWaiting())));
          self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
          self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(fetch(e.request).then(r=>{const copy=r.clone();caches.open(CACHE).then(c=>c.put(e.request,copy));return r}).catch(()=>caches.match(e.request).then(r=>r||caches.match('./index.html'))))});''',encoding='utf-8')

          Path('icon.svg').write_text('''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#07101b"/><circle cx="256" cy="256" r="178" fill="#111b2b" stroke="#48d57f" stroke-width="18"/><path d="M256 390V190" stroke="#f7f9fc" stroke-width="22" stroke-linecap="round"/><path d="M252 238c-84-5-126-52-130-111 72-5 125 32 130 111Z" fill="#48d57f"/><path d="M260 294c79-4 119-48 123-104-68-5-118 30-123 104Z" fill="#71adff"/><text x="256" y="438" text-anchor="middle" font-family="Arial" font-size="54" font-weight="700" fill="#f7f9fc">40</text></svg>''',encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest sw.js icon.svg
          git diff --cached --quiet || git commit -m "Upgrade fixed header, UI and offline PWA [skip ci]"
          git push
