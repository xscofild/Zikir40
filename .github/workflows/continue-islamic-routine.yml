name: Continue Islamic routine after 40 days

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/continue-islamic-routine.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply post-40 upgrade
        run: python3 .github/scripts/continue_islamic.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Continue Zikir40 after day 40 with prayers and Islamic calendar [skip ci]"
          git push
